<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Warehouse | VaultSpace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .form-input { @apply transition-all focus:ring-2 focus:ring-blue-500 focus:border-blue-500; }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-blue-50 min-h-screen">
    <div class="max-w-2xl mx-auto px-4 py-12">
        <div class="bg-white rounded-2xl shadow-lg p-8 transition-all hover:shadow-xl">
            <!-- Header -->
            <div class="mb-8 text-center">
                <div class="inline-block p-4 bg-blue-100 rounded-2xl mb-6">
                    <svg class="w-12 h-12 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                              d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5"/>
                    </svg>
                </div>
                <h1 class="text-3xl font-bold text-gray-900 mb-2">🏭 Add New Warehouse</h1>
                <p class="text-gray-600">Register your warehouse on the blockchain</p>
            </div>

            <!-- Form -->
            <form method="post" class="space-y-6">
                {% csrf_token %}
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Name</label>
                        <input type="text" name="name" required
                               class="form-input w-full px-4 py-3 rounded-lg border border-gray-300">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Location</label>
                        <input type="text" name="location" required
                               class="form-input w-full px-4 py-3 rounded-lg border border-gray-300">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Capacity</label>
                        <input type="number" name="capacity" required
                               class="form-input w-full px-4 py-3 rounded-lg border border-gray-300">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Facilities</label>
                        <textarea name="facilities" required
                                  class="form-input w-full px-4 py-3 rounded-lg border border-gray-300 h-32"></textarea>
                    </div>
                </div>

                <button type="submit" 
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white px-6 py-4 rounded-lg 
                               font-medium transition-colors flex items-center justify-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                              d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
                    </svg>
                    Deploy to Blockchain
                </button>
            </form>
        </div>

        <!-- Footer Note -->
        {% comment %} <div class="mt-8 text-center text-sm text-gray-500">
            <p>Powered by Ethereum Sepolia Testnet</p>
            <p class="mt-1">Transactions typically confirm in 15-30 seconds</p>
        </div> {% endcomment %}
    </div>
</body>
</html>
